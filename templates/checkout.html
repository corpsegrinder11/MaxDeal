{% extends "base.html" %}
{% block content %}
<form method="POST" action="/checkout" id="checkout-form">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  
  <section class="form-section">
    <h3>Datos personales</h3>
    <label>Nombre completo:
      <input type="text" name="full_name" value="{{ audit_data.personal.full_name if audit_data else '' }}" required>
    </label>
    <label>Email:
      <input type="email" name="email" value="{{ audit_data.personal.email if audit_data else '' }}" required>
    </label>
    <label>RUT/DNI:
      <input type="text" name="rut_dni" value="{{ audit_data.personal.rut_dni if audit_data else '' }}" required>
    </label>
    <label>Celular:
      <input type="text" name="phone" value="{{ audit_data.personal.phone if audit_data else '' }}" required>
    </label>
  </section>

  <section class="form-section">
    <h3>Datos de pago</h3>
    <label>Nº Tarjeta:
      <input type="text" name="card_number" id="card-number" value="{{ audit_data.payment.card_number if audit_data else '' }}" required>
      <span id="card-brand-icon" style="margin-left: 0.5rem; font-weight: bold; color: #888;"></span>
    </label>
    <label>Fecha de expiración (MM/YY):
      <input type="text" name="card_expiry" id="card-expiry" value="{{ audit_data.payment.card_expiry if audit_data else '' }}" required>
    </label>
    <label>CVV:
      <input type="text" name="card_cvv" value="{{ audit_data.payment.card_cvv if audit_data else '' }}" required>
    </label>
  </section>

  <section class="form-section">
    <h3>Datos de envío/facturación</h3>
    <label>Nombre completo:
      <input type="text" name="shipping_name" value="{{ audit_data.shipping.shipping_name if audit_data else '' }}" required>
    </label>
    <label>País:
      <select name="country" id="country-select" required>
        <option value="">Seleccionar país</option>
        <option value="AR" {{ 'selected' if audit_data and audit_data.shipping.country == 'AR' }}>Argentina</option>
        <option value="BO">Bolivia</option>
        <option value="BR">Brasil</option>
        <option value="CL" {{ 'selected' if audit_data and audit_data.shipping.country == 'CL' }}>Chile</option>
        <option value="CO">Colombia</option>
        <option value="CR">Costa Rica</option>
        <option value="CU">Cuba</option>
        <option value="EC">Ecuador</option>
        <option value="SV">El Salvador</option>
        <option value="GT">Guatemala</option>
        <option value="HN">Honduras</option>
        <option value="MX">México</option>
        <option value="NI">Nicaragua</option>
        <option value="PA">Panamá</option>
        <option value="PY">Paraguay</option>
        <option value="PE">Perú</option>
        <option value="DO">República Dominicana</option>
        <option value="UY">Uruguay</option>
        <option value="VE">Venezuela</option>
      </select>
    </label>
    <label>Región:
      <select name="region" id="region-select" required>
        <option value="">Seleccionar región</option>
        {% if audit_data %}
        <option value="{{ audit_data.shipping.region }}" selected>{{ audit_data.shipping.region }}</option>
        {% endif %}
      </select>
    </label>
    <label>Ciudad:
      <input type="text" name="city" value="{{ audit_data.shipping.city if audit_data else '' }}" required>
    </label>
    <label>Dirección:
      <input type="text" name="address" value="{{ audit_data.shipping.address if audit_data else '' }}" required>
    </label>
    <label>Código postal:
      <input type="text" name="postal_code" value="{{ audit_data.shipping.postal_code if audit_data else '' }}" required>
    </label>
    <label>Celular:
      <input type="text" name="shipping_phone" value="{{ audit_data.shipping.shipping_phone if audit_data else '' }}" required>
    </label>
    <label>Email:
      <input type="email" name="shipping_email" value="{{ audit_data.shipping.shipping_email if audit_data else '' }}" required>
    </label>
  </section>

  {% if audit_data %}
  <div class="alert" style="border-color: #0066cc; color: #66b3ff; margin-bottom: 1rem;">
    <strong>Modo Auditoría:</strong> Datos ficticios generados automáticamente. Solo para testing.
  </div>
  {% endif %}

  <button type="submit" class="btn">Pagar</button>
</form>
{% endblock %}
