<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- SEO Meta Tags -->
  <title>Desarrollo Web y Automatización para Emprendedores | Landing Pages desde $95.000 CLP</title>
  <meta name="description" content="Creo landing pages profesionales y automatizo tu WhatsApp para que vendas más. Entrega en 48-72 horas. Precios accesibles para emprendedores en Chile y Latinoamérica.">
  <meta name="keywords" content="landing page, página web, automatización WhatsApp, desarrollo web, emprendedores Chile, tienda online, web profesional">
  <meta name="author" content="MaxDeal">
  <meta name="robots" content="index, follow">
  
  <!-- Open Graph (Facebook, LinkedIn, WhatsApp) -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Desarrollo Web y Automatización para Emprendedores">
  <meta property="og:description" content="Landing pages profesionales desde $95.000 CLP. Automatización de WhatsApp desde $47.000 CLP. Entrega en 48-72 horas.">
  <meta property="og:url" content="https://maxdeal.vercel.app">
  <meta property="og:site_name" content="MaxDeal">
  
  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Desarrollo Web y Automatización para Emprendedores">
  <meta name="twitter:description" content="Landing pages profesionales desde $95.000 CLP. Automatización de WhatsApp desde $47.000 CLP.">
  
  <!-- Canonical URL -->
  <link rel="canonical" href="https://maxdeal.vercel.app">
  
  <!-- Favicon (opcional, puedes añadir uno después) -->
  <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
  
  <!-- Schema.org Markup -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "ProfessionalService",
    "name": "MaxDeal",
    "description": "Desarrollo de landing pages y automatización de WhatsApp para emprendedores",
    "url": "https://maxdeal.vercel.app",
    "priceRange": "$$",
    "address": {
      "@type": "PostalAddress",
      "addressCountry": "CL"
    },
    "areaServed": {
      "@type": "Country",
      "name": "Chile"
    },
    "hasOfferCatalog": {
      "@type": "OfferCatalog",
      "name": "Servicios de Desarrollo Web",
      "itemListElement": [
        {
          "@type": "Offer",
          "itemOffered": {
            "@type": "Service",
            "name": "Landing Page Profesional",
            "description": "Diseño moderno y responsive, optimizada para vender",
            "offers": {
              "@type": "Offer",
              "price": "95000",
              "priceCurrency": "CLP"
            }
          }
        },
        {
          "@type": "Offer",
          "itemOffered": {
            "@type": "Service",
            "name": "Automatización WhatsApp",
            "description": "Respuestas automáticas 24/7 para tu negocio",
            "offers": {
              "@type": "Offer",
              "price": "47000",
              "priceCurrency": "CLP"
            }
          }
        },
        {
          "@type": "Offer",
          "itemOffered": {
            "@type": "Service",
            "name": "Página Web Completa",
            "description": "Hasta 5 secciones, diseño personalizado",
            "offers": {
              "@type": "Offer",
              "price": "190000",
              "priceCurrency": "CLP"
            }
          }
        }
      ]
    }
  }
  </script>
  
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
  <header>
    <h1>MaxDeal</h1>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer>
    <p>Entorno de pruebas — no usar datos reales</p>
    <p>
      <a href="/terms">Términos y Condiciones</a> • 
      <a href="/privacy">Política de Privacidad</a>
    </p>
  </footer>
  <script src="/static/js/main.js"></script>
</body>
</html>
