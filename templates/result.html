{% extends "base.html" %}
{% block content %}
{% if status == "success" %}
<div class="alert success">
  <p>Compra completada. Los datos han sido enviados correctamente.</p>
</div>
{% elif status == "error" %}
<div class="alert error">
  <p>Ocurrió un error. Inténtalo de nuevo.</p>
</div>
{% else %}
<div class="alert">
  <p>Estado desconocido.</p>
</div>
{% endif %}
{% endblock %}
